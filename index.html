<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e4f">
  <title>바퀴길</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%230b6e4f' stroke-width='5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%230b6e4f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>바퀴길</h1>
    <!-- 휴대폰에서는 화면 아래에 고정되고, 넓은 화면에서는 상단에 놓인다 -->
    <nav class="tabbar" aria-label="화면 전환">
      <button class="tab is-active" type="button" data-tab="route">길찾기</button>
      <button class="tab" type="button" data-tab="surface">노면 지도</button>
    </nav>
    <span id="exampleBadge" class="badge" hidden>예시 데이터</span>
  </header>

  <main>
    <!-- 탭 1. 길찾기 -->
    <section id="tab-route" class="tab-panel route-layout" aria-label="길찾기">
      <div class="route-controls">
        <div class="card">
          <fieldset class="field">
            <legend>이동수단</legend>
            <div class="segmented segmented-3">
              <label><input type="radio" name="vehicle" value="wheelchair" checked><span>휠체어</span></label>
              <label><input type="radio" name="vehicle" value="stroller"><span>유모차</span></label>
              <label><input type="radio" name="vehicle" value="bicycle"><span>자전거</span></label>
            </div>
          </fieldset>
          <label class="field">
            <span>출발</span>
            <select id="startSelect"></select>
          </label>
          <label class="field">
            <span>도착</span>
            <select id="goalSelect"></select>
          </label>
          <p id="routeMsg" class="route-summary" role="status"></p>
        </div>

        <div class="card" id="routeResult" hidden>
          <table class="compare">
            <thead>
              <tr><th scope="col"></th><th scope="col">최단 길</th><th scope="col">추천 길</th></tr>
            </thead>
            <tbody id="compareBody"></tbody>
          </table>
          <p id="unmeasuredNote" class="msg is-warn"></p>
        </div>
      </div>

      <div class="card map-card">
        <div id="routeMap" class="map" role="img" aria-label="최단 경로와 추천 경로 지도"></div>
        <ul class="legend">
          <li><i class="swatch swatch-best"></i>추천 길</li>
          <li><i class="swatch swatch-short"></i>최단 길</li>
        </ul>
      </div>
    </section>

    <!-- 탭 2. 노면 지도 -->
    <section id="tab-surface" class="tab-panel" aria-label="노면 지도" hidden>
      <div class="card map-card">
        <h2>노면 상태 <small id="surfaceVehicle"></small></h2>
        <div id="surfaceMap" class="map" role="img" aria-label="구간별 노면 상태 지도"></div>
        <ul class="legend">
          <li><i class="swatch" style="background: var(--surface-good)"></i>편함</li>
          <li><i class="swatch" style="background: var(--surface-fair)"></i>보통</li>
          <li><i class="swatch" style="background: var(--surface-poor)"></i>불편</li>
          <li><i class="swatch" style="background: var(--surface-unmeasured)"></i>미측정</li>
          <li><i class="swatch swatch-blocked"></i>통행 불가</li>
        </ul>
      </div>
      <div class="card">
        <h2>구간별 측정값</h2>
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr><th>구간</th><th>상태</th><th>진동 RMS</th><th>턱</th><th>최대 경사</th><th>측정</th></tr>
            </thead>
            <tbody id="surfaceBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
